name: Daily Refresh
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh timestamp
        run: |
          date -u > last-updated.txt
          echo "Updated $(date -u)" >> last-updated.txt
      - name: Commit
        run: |
          git config user.name "Agnes Bot"
          git config user.email "agnes@bot.local"
          git add last-updated.txt || true
          git commit -m "chore: daily refresh $(date -u)" || echo "no changes"
          git push || echo "push skipped"
